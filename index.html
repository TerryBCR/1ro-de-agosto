<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sharise</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #faf3f0; 
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gift-screen {
            position: absolute;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .gift-wrapper {
            cursor: pointer;
            position: relative;
            margin-top: 50px;
            transition: transform 0.3s ease;
        }

        .gift-wrapper:hover {
            transform: scale(1.05);
        }

        .gift-box {
            width: 140px;
            height: 120px;
            background: #d48c8f;
            position: relative;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: opacity 0.5s ease 0.4s;
        }

        .gift-lid {
            width: 154px;
            height: 40px;
            background: #eab2b5;
            position: absolute;
            top: -40px;
            left: -7px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.6s ease, opacity 0.6s ease;
            z-index: 2;
        }

        .ribbon-v {
            position: absolute;
            width: 24px;
            height: 100%;
            background: #fff;
            left: 58px;
        }

        .ribbon-h {
            position: absolute;
            height: 24px;
            width: 100%;
            background: #fff;
            top: 48px;
        }

        .ribbon-lid-v {
            position: absolute;
            width: 24px;
            height: 100%;
            background: #fff;
            left: 65px;
        }

        .click-text {
            margin-top: 30px;
            color: #d48c8f;
            font-size: 1.2rem;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .gift-wrapper.open .gift-lid {
            transform: translateY(-60px) rotate(15deg);
            opacity: 0;
        }

        .gift-wrapper.open .gift-box {
            opacity: 0;
        }

        #card-screen {
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #card-screen.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(200, 160, 160, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #d48c8f;
            font-size: 2.2rem;
            margin-bottom: 20px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-top: 0;
        }

        .foto-pareja {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 2s ease;
            box-shadow: 0 5px 15px rgba(200, 160, 160, 0.2);
        }

        .foto-pareja.visible {
            opacity: 1;
        }

        .typing-message {
            color: #7a6565;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 100px;
            width: 100%;
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
            border-radius: 12px;
            background: #fff;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        audio {
            width: 100%;
            height: 40px;
            outline: none;
        }

        .petal {
            position: absolute;
            border-radius: 50% 50% 0 50%;
            transform: rotate(45deg);
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div id="gift-screen">
            <div class="gift-wrapper" id="the-gift">
                <div class="gift-lid">
                    <div class="ribbon-lid-v"></div>
                </div>
                <div class="gift-box">
                    <div class="ribbon-v"></div>
                    <div class="ribbon-h"></div>
                </div>
            </div>
            <div class="click-text">toca el regalo</div>
        </div>

        <div id="card-screen">
            <div class="card">
                <h1>Para Sharise</h1>
                
                <img src="foto.jpg" alt="Sharise y yo" class="foto-pareja" id="main-photo">
                
                <div id="typing-text" class="typing-message"></div>
                
                <div class="audio-player">
                    <audio controls loop>
                        <source src="cancion.mp3" type="audio/mpeg">
                        tu navegador no soporta el audio
                    </audio>
                </div>
            </div>
        </div>

    </div>

    <script>
        const giftWrapper = document.getElementById('the-gift');
        const giftScreen = document.getElementById('gift-screen');
        const cardScreen = document.getElementById('card-screen');
        const mainPhoto = document.getElementById('main-photo');
        let giftOpened = false;

        giftWrapper.addEventListener('click', () => {
            if (giftOpened) return;
            giftOpened = true;

            giftWrapper.classList.add('open');

            setTimeout(() => {
                giftScreen.style.opacity = '0';
                giftScreen.style.visibility = 'hidden';
                cardScreen.classList.add('visible');
                
                setTimeout(() => {
                    mainPhoto.classList.add('visible');
                    setTimeout(typeMessage, 1000);
                }, 600);
                
            }, 800);
        });

        const messageArray = [
            "mi niña hermosa",
            "cada dia me enamoro mas de ti y de lo increible que eres",
            "eres el regalo mas bonito que me ha dado la vida",
            "quiero cuidarte y amarte por siempre"
        ];
        
        let messageIndex = 0;
        let charIndex = 0;
        const typingElement = document.getElementById("typing-text");

        function typeMessage() {
            if (messageIndex < messageArray.length) {
                let currentMessage = messageArray[messageIndex];
                
                if (charIndex < currentMessage.length) {
                    typingElement.innerHTML += currentMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeMessage, 60); 
                } else {
                    setTimeout(() => {
                        typingElement.innerHTML += '<br>';
                        messageIndex++;
                        charIndex = 0;
                        typeMessage();
                    }, 800); 
                }
            }
        }

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const colors = ['#f4c4c4', '#f8d9d9', '#eeb5b5'];
            petal.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            const size = Math.random() * 12 + 8;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 6 + 6;
            petal.style.animation = `fall ${duration}s linear infinite`;
            
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        setInterval(createPetal, 500);

    </script>
</body>
</html>
